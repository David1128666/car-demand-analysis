kafka {
  bootstrap { servers = "node1:9092" }
  group { id = "car-demand-analysis-group" }
  auto { offset { reset = "latest" } }
  topics {
    user-behavior = "car-user-behavior"
    car-search = "car-search"
    car-consult = "car-consult"
    car-price-quote = "car-price-quote"
    car-loan-inquiry = "car-loan-inquiry"
  }
}
mysql {
  url = "jdbc:mysql://localhost:3306/car_demand_analysis?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
  user = "root"
  password = "root"
  driver = "com.mysql.cj.jdbc.Driver"
}
spark {
  app { name = "CarDemandAnalysis" }
  master = "local[*]"
  streaming { batch { duration { seconds = 10 } } }
  checkpoint { dir = "./checkpoint" }
}
