# ============================================
# Flume配置文件 - 汽车需求数据分析
# 使用 TAILDIR Source 持续监控文件
# 5个Kafka Topic: car-user-behavior, car-search, car-consult, car-price-quote, car-loan-inquiry
# ============================================

# ============================================
# Agent: car-demand-analytics
# ============================================
car-demand-analytics.sources = behavior-source search-source consult-source price-source loan-source
car-demand-analytics.channels = behavior-channel search-channel consult-channel price-channel loan-channel
car-demand-analytics.sinks = behavior-kafka search-kafka consult-kafka price-kafka loan-kafka

# ============================================
# Source 1: 用户行为数据 (TAILDIR)
# ============================================
car-demand-analytics.sources.behavior-source.type = TAILDIR
car-demand-analytics.sources.behavior-source.channels = behavior-channel
car-demand-analytics.sources.behavior-source.filegroups = f1
car-demand-analytics.sources.behavior-source.filegroups.f1 = /export/data/mock/data_BD_project/output/behavior.txt
car-demand-analytics.sources.behavior-source.fileHeader = true

# ============================================
# Source 2: 搜索数据 (TAILDIR)
# ============================================
car-demand-analytics.sources.search-source.type = TAILDIR
car-demand-analytics.sources.search-source.channels = search-channel
car-demand-analytics.sources.search-source.filegroups = f2
car-demand-analytics.sources.search-source.filegroups.f2 = /export/data/mock/data_BD_project/output/search.txt
car-demand-analytics.sources.search-source.fileHeader = true

# ============================================
# Source 3: 咨询数据 (TAILDIR)
# ============================================
car-demand-analytics.sources.consult-source.type = TAILDIR
car-demand-analytics.sources.consult-source.channels = consult-channel
car-demand-analytics.sources.consult-source.filegroups = f3
car-demand-analytics.sources.consult-source.filegroups.f3 = /export/data/mock/data_BD_project/output/consult.txt
car-demand-analytics.sources.consult-source.fileHeader = true

# ============================================
# Source 4: 价格报价数据 (TAILDIR)
# ============================================
car-demand-analytics.sources.price-source.type = TAILDIR
car-demand-analytics.sources.price-source.channels = price-channel
car-demand-analytics.sources.price-source.filegroups = f4
car-demand-analytics.sources.price-source.filegroups.f4 = /export/data/mock/data_BD_project/output/price-quote.txt
car-demand-analytics.sources.price-source.fileHeader = true

# ============================================
# Source 5: 贷款咨询数据 (TAILDIR)
# ============================================
car-demand-analytics.sources.loan-source.type = TAILDIR
car-demand-analytics.sources.loan-source.channels = loan-channel
car-demand-analytics.sources.loan-source.filegroups = f5
car-demand-analytics.sources.loan-source.filegroups.f5 = /export/data/mock/data_BD_project/output/loan-inquiry.txt
car-demand-analytics.sources.loan-source.fileHeader = true

# ============================================
# Channel 1: 用户行为数据通道
# ============================================
car-demand-analytics.channels.behavior-channel.type = memory
car-demand-analytics.channels.behavior-channel.capacity = 1000
car-demand-analytics.channels.behavior-channel.transactionCapacity = 100

# ============================================
# Channel 2: 搜索数据通道
# ============================================
car-demand-analytics.channels.search-channel.type = memory
car-demand-analytics.channels.search-channel.capacity = 1000
car-demand-analytics.channels.search-channel.transactionCapacity = 100

# ============================================
# Channel 3: 咨询数据通道
# ============================================
car-demand-analytics.channels.consult-channel.type = memory
car-demand-analytics.channels.consult-channel.capacity = 1000
car-demand-analytics.channels.consult-channel.transactionCapacity = 100

# ============================================
# Channel 4: 价格报价数据通道
# ============================================
car-demand-analytics.channels.price-channel.type = memory
car-demand-analytics.channels.price-channel.capacity = 1000
car-demand-analytics.channels.price-channel.transactionCapacity = 100

# ============================================
# Channel 5: 贷款咨询数据通道
# ============================================
car-demand-analytics.channels.loan-channel.type = memory
car-demand-analytics.channels.loan-channel.capacity = 1000
car-demand-analytics.channels.loan-channel.transactionCapacity = 100

# ============================================
# Sink 1: 用户行为 -> Kafka
# ============================================
car-demand-analytics.sinks.behavior-kafka.type = org.apache.flume.sink.kafka.KafkaSink
car-demand-analytics.sinks.behavior-kafka.kafka.bootstrap.servers = localhost:9092
car-demand-analytics.sinks.behavior-kafka.topic = car-user-behavior
car-demand-analytics.sinks.behavior-kafka.batchSize = 100

# ============================================
# Sink 2: 搜索数据 -> Kafka
# ============================================
car-demand-analytics.sinks.search-kafka.type = org.apache.flume.sink.kafka.KafkaSink
car-demand-analytics.sinks.search-kafka.kafka.bootstrap.servers = localhost:9092
car-demand-analytics.sinks.search-kafka.topic = car-search
car-demand-analytics.sinks.search-kafka.batchSize = 100

# ============================================
# Sink 3: 咨询数据 -> Kafka
# ============================================
car-demand-analytics.sinks.consult-kafka.type = org.apache.flume.sink.kafka.KafkaSink
car-demand-analytics.sinks.consult-kafka.kafka.bootstrap.servers = localhost:9092
car-demand-analytics.sinks.consult-kafka.topic = car-consult
car-demand-analytics.sinks.consult-kafka.batchSize = 100

# ============================================
# Sink 4: 价格报价 -> Kafka
# ============================================
car-demand-analytics.sinks.price-kafka.type = org.apache.flume.sink.kafka.KafkaSink
car-demand-analytics.sinks.price-kafka.kafka.bootstrap.servers = localhost:9092
car-demand-analytics.sinks.price-kafka.topic = car-price-quote
car-demand-analytics.sinks.price-kafka.batchSize = 100

# ============================================
# Sink 5: 贷款咨询 -> Kafka
# ============================================
car-demand-analytics.sinks.loan-kafka.type = org.apache.flume.sink.kafka.KafkaSink
car-demand-analytics.sinks.loan-kafka.kafka.bootstrap.servers = localhost:9092
car-demand-analytics.sinks.loan-kafka.topic = car-loan-inquiry
car-demand-analytics.sinks.loan-kafka.batchSize = 100

# ============================================
# 绑定关系
# ============================================
car-demand-analytics.sources.behavior-source.channels = behavior-channel
car-demand-analytics.sinks.behavior-kafka.channel = behavior-channel

car-demand-analytics.sources.search-source.channels = search-channel
car-demand-analytics.sinks.search-kafka.channel = search-channel

car-demand-analytics.sources.consult-source.channels = consult-channel
car-demand-analytics.sinks.consult-kafka.channel = consult-channel

car-demand-analytics.sources.price-source.channels = price-channel
car-demand-analytics.sinks.price-kafka.channel = price-channel

car-demand-analytics.sources.loan-source.channels = loan-channel
car-demand-analytics.sinks.loan-kafka.channel = loan-channel
